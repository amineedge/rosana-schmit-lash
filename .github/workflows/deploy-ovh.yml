name: Deploy to rosanaschmit.com.br

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rosana-ovh-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Install SFTP client
        if: env.OVH_SFTP_PASSWORD != ''
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Deploy the production site
        if: env.OVH_SFTP_PASSWORD != ''
        env:
          OVH_SFTP_HOST: ftp.cluster121.hosting.ovh.net
          OVH_SFTP_USER: rosanao
        run: |
          lftp <<LFTP
          open -u "$OVH_SFTP_USER","$OVH_SFTP_PASSWORD" "sftp://$OVH_SFTP_HOST"
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:auto-confirm yes
          cd www
          put index.html -o index-new.html
          put styles.css -o styles-new.css
          put app.js -o app-new.js
          mirror --reverse --only-newer --parallel=2 assets assets
          rm index.html
          rm styles.css
          rm app.js
          mv index-new.html index.html
          mv styles-new.css styles.css
          mv app-new.js app.js
          bye
          LFTP

      - name: Explain missing deployment credential
        if: env.OVH_SFTP_PASSWORD == ''
        run: echo "OVH_SFTP_PASSWORD is not configured; production deployment was skipped."
